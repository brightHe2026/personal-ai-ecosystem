# personal-ai-ecosystem CI MVP (TASK-005C-B)
#
# Architecture (TASK-005C-A):
# - One always-on workflow. Do not use workflow-level on.paths
#   (skipped workflows cannot satisfy a required check).
# - Path detection: native git diff in job `changes` (no third-party path-filter action).
# - App jobs run only for their change scope (or all, see below).
# - Job `ci-gate` is the stable aggregate check for future Branch Protection.
# - GitHub Checks are the CI runtime source of truth.
# - This workflow must not commit, push, or edit .agent/state.json.
#
# Run-all triggers:
# - push to main
# - any change under .github/workflows/**

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      sales_backend: ${{ steps.filter.outputs.sales_backend }}
      sales_frontend: ${{ steps.filter.outputs.sales_frontend }}
      knowledge_backend: ${{ steps.filter.outputs.knowledge_backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect change scope
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          sales_backend=false
          sales_frontend=false
          knowledge_backend=false

          run_all() {
            sales_backend=true
            sales_frontend=true
            knowledge_backend=true
          }

          if [ "$EVENT_NAME" = "push" ]; then
            echo "push to main: running all app jobs"
            run_all
          else
            if [ -z "${PR_BASE_SHA:-}" ] || [ -z "${PR_HEAD_SHA:-}" ]; then
              echo "Missing pull_request base/head SHA" >&2
              exit 1
            fi

            git fetch --no-tags origin "$PR_BASE_SHA" "$PR_HEAD_SHA"

            echo "Changed files (${PR_BASE_SHA}...${PR_HEAD_SHA}):"
            git diff --name-only "${PR_BASE_SHA}...${PR_HEAD_SHA}"

            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                .github/workflows/*)
                  echo "CI workflow change detected: running all app jobs"
                  run_all
                  break
                  ;;
              esac
            done < <(git diff --name-only "${PR_BASE_SHA}...${PR_HEAD_SHA}")

            if [ "$sales_backend" != true ] || [ "$sales_frontend" != true ] || [ "$knowledge_backend" != true ]; then
              while IFS= read -r path; do
                [ -z "$path" ] && continue
                case "$path" in
                  apps/sales-agent/backend|apps/sales-agent/backend/*)
                    sales_backend=true
                    ;;
                  apps/sales-agent/frontend|apps/sales-agent/frontend/*)
                    sales_frontend=true
                    ;;
                  agents/knowledge-agent/backend|agents/knowledge-agent/backend/*)
                    knowledge_backend=true
                    ;;
                esac
              done < <(git diff --name-only "${PR_BASE_SHA}...${PR_HEAD_SHA}")
            fi
          fi

          echo "sales_backend=${sales_backend}"
          echo "sales_frontend=${sales_frontend}"
          echo "knowledge_backend=${knowledge_backend}"

          {
            echo "sales_backend=${sales_backend}"
            echo "sales_frontend=${sales_frontend}"
            echo "knowledge_backend=${knowledge_backend}"
          } >> "$GITHUB_OUTPUT"

  sales-agent-backend:
    name: sales-agent-backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sales_backend == 'true'
    defaults:
      run:
        working-directory: apps/sales-agent/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/sales-agent/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: FastAPI import check
        run: python -c "from app.main import app; print(app.title)"

  sales-agent-frontend:
    name: sales-agent-frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sales_frontend == 'true'
    defaults:
      run:
        working-directory: apps/sales-agent/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/sales-agent/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  knowledge-agent-backend:
    name: knowledge-agent-backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.knowledge_backend == 'true'
    defaults:
      run:
        working-directory: agents/knowledge-agent/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/knowledge-agent/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Isolate runner from tracked dotenv
        run: rm -f .env

      - name: Run unit tests
        run: python -m pytest -q

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs:
      - changes
      - sales-agent-backend
      - sales-agent-frontend
      - knowledge-agent-backend
    if: always()
    steps:
      - name: Aggregate required jobs
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          SALES_BACKEND: ${{ needs.sales-agent-backend.result }}
          SALES_FRONTEND: ${{ needs.sales-agent-frontend.result }}
          KNOWLEDGE_BACKEND: ${{ needs.knowledge-agent-backend.result }}
        run: |
          set -euo pipefail

          echo "changes=${CHANGES}"
          echo "sales-agent-backend=${SALES_BACKEND}"
          echo "sales-agent-frontend=${SALES_FRONTEND}"
          echo "knowledge-agent-backend=${KNOWLEDGE_BACKEND}"

          fail=0

          if [ "$CHANGES" != "success" ]; then
            echo "::error::changes did not succeed (result=${CHANGES})"
            fail=1
          fi

          check_app_job() {
            local name="$1"
            local result="$2"
            case "$result" in
              success|skipped)
                echo "${name}: ${result} (ok)"
                ;;
              *)
                echo "::error::${name} failed (result=${result})"
                fail=1
                ;;
            esac
          }

          check_app_job "sales-agent-backend" "$SALES_BACKEND"
          check_app_job "sales-agent-frontend" "$SALES_FRONTEND"
          check_app_job "knowledge-agent-backend" "$KNOWLEDGE_BACKEND"

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

          echo "ci-gate passed"
